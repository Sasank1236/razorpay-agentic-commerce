services:
  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  - type: web
    name: razorbuy-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: razorbuy-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false          # set manually in Render dashboard
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: RAZORPAY_KEY_ID
        sync: false          # set manually in Render dashboard
      - key: RAZORPAY_KEY_SECRET
        sync: false          # set manually in Render dashboard
      - key: BACKEND_CORS_ORIGINS
        sync: false          # set to your Vercel frontend URL after deploy
      - key: PYTHON_VERSION
        value: "3.11.0"

  # ── Startup: seed the DB on first deploy ─────────────────────────────────────
  - type: worker
    name: razorbuy-seed
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.db.seed
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: razorbuy-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

# ── PostgreSQL Database ───────────────────────────────────────────────────────
databases:
  - name: razorbuy-db
    databaseName: razorbuy
    user: razorbuy
    plan: free
